name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
    - "macos-native/**"
    - ".github/workflows/macos-native.yml"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"
      - "macos-native/**"

jobs:
  run-ci:
    # flutter-build.yml has jobs that request contents: write; a caller cannot grant
    # less, or the run fails at startup on repositories whose default token is read-only.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
